## --- e-Paper Display ------
## 3.97" with SSD1677
## https://docs.waveshare.com/ESP32-S3-ePaper-3.97/Resources-And-Documents
display:
  - platform: epaper_spi
    id: eink_display
    model: SSD1677
    full_update_every: 20
    update_interval: 45s   ## 30s display test, never@update by HA
    spi_id: epd_spi
    dimensions:
      width: 800
      height: 480
    transform:
      mirror_x: true
      mirror_y: false
    rotation: 0 #90 # Rotate to portrait
    cs_pin: GPIO10
    dc_pin: GPIO9
    reset_pin: GPIO46
#   reset_duration: 500ms
    busy_pin: { number: GPIO3, inverted: false, mode: { input: True, pulldown: True } }
    pages:
      - id: seite_kalender
        lambda: |-
          auto WHITE = Color(255, 255, 255);  // level 3
          auto LIGHT = Color(170, 170, 170);  // level 2
          auto DARK  = Color(85, 85, 85);     // level 1
          auto BLACK = Color(0, 0, 0);        // level 0
    
           /// --------------
          // TEST
          // ---------------
          /*
          it.fill(WHITE);                       // Hintergrund weiß
          it.print(20, 20, id(font_title), BLACK, "Hello World!");
          it.rectangle(0, 0, it.get_width() - 1, it.get_height() - 1);
          */
          
          auto draw_block = [&](int x, const char *title, std::string txt) {
            it.printf(x, 10, id(font_title),BLACK , "%s", title);
            it.line(x, 55, x + 370, 55, BLACK);
            int y = 70;
            size_t pos = 0;
            while (pos <= txt.size() && y < 460) {
              size_t nl = txt.find('\n', pos);
              if (nl == std::string::npos) nl = txt.size();
              it.printf(x, y, id(font_item), BLACK, "%s", txt.substr(pos, nl - pos).c_str());
              y += 36;
              pos = nl + 1;
            }
          };
          draw_block(15, "Heute", id(cal_heute).state);
          draw_block(415, "Morgen", id(cal_morgen).state);
          it.line(400, 10, 400, 470, BLACK);
      
      - id: seite_stundenplan
        lambda: |-
          auto WHITE = Color(255, 255, 255);  // level 3
          auto LIGHT = Color(170, 170, 170);  // level 2
          auto DARK  = Color(85, 85, 85);     // level 1
          auto BLACK = Color(0, 0, 0);        // level 0
          
          std::string s = id(stundenplan).state;
          const char *days[5] = {"Mo", "Di", "Mi", "Do", "Fr"};
          const int x0 = 15, tw = 90, cw = 136, y0 = 10, hh = 48, rh = 46;
          for (int c = 0; c < 5; c++)
            //it.printf(x0 + tw + c * cw + cw / 2, y0, id(font_item), BLACK, TextAlign::TOP_CENTER, "%s", days[c]);
            it.printf(x0 + tw + c * cw + cw / 2, y0, id(font_item), BLACK, "%s", days[c]);
          it.line(x0, y0 + hh - 6, 785, y0 + hh - 6, BLACK);
          int r = 0;
          size_t pos = 0;
          while (pos < s.size() && r < 8) {
            size_t nl = s.find('\n', pos);
            if (nl == std::string::npos) nl = s.size();
            std::string row = s.substr(pos, nl - pos);
            pos = nl + 1;
            int y = y0 + hh + r * rh;
            int c = -1;
            size_t p = 0;
            while (p <= row.size() && c < 5) {
              size_t bar = row.find('|', p);
              if (bar == std::string::npos) bar = row.size();
              std::string cell = row.substr(p, bar - p);
              if (cell.size() > 10) cell = cell.substr(0, 10);
              int x = (c < 0) ? x0 : x0 + tw + c * cw + 4;
              it.printf(x, y, id(font_desc), BLACK,"%s", cell.c_str());
              p = bar + 1;
              c++;
            }
            it.line(x0, y + rh - 6, 785, y + rh - 6, BLACK);
            r++;
          }

script:
  - id: refresh_display
    mode: restart          # schnelles Drücken stapelt keine Refreshes
    then:
      - delay: 800ms
      - component.update: eink_display


