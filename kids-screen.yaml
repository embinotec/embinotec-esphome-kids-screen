## ------- POWER MANGEMENT -------
## ESP32 should be powered by three times 2800mAh rechargable AA batteries.
## To save some power the ESP should not always be connected to your wifi and have some rest
## to cover the hole day with measurements.
deep_sleep:
  id: during_day
  run_duration: 5min
  sleep_duration: 13min
  esp32_ext1_wakeup: 
    mode: ANY_LOW
    pins: 
        - pin: 
            number: GPIO4 ## JOG-UP
         #   allow_other_uses: true
          on_wake:
            then:
              - logger.log: "awake"
        - pin: 
            number: GPIO5   ## JOG-PUSH
          #  allow_other_uses: true
          on_wake:
            then:
              - logger.log: "awake"
        - pin: 
            number: GPIO6  ## JOG-DOWN
          #  allow_other_uses: true
          on_wake:
            then:
              - logger.log: "awake"
  #- id: during_night
  #  run_duration: 5min
  #  sleep_duration: 30min



## ------ LOGGING ------
## Options: NONE, ERROR, WARN, INFO, DEBUG, VERBOSE, VERY_VERBOSE
logger:
  baud_rate: 115200  ## 0=Disable, 
  level: NONE

# --- SPI-Bus fürs Display ---
spi:
  - id: epd_spi
    clk_pin: GPIO11
    mosi_pin: GPIO12

   
## ------ I2C SETTINGS ----------
## DO NOT CHANGE !!!
## I2C is an IC to IC connection to read for instance digital values from sensors.
i2c:
  - id: bus_a
    sda: GPIO41
    scl:
      number: GPIO42
    frequency: 100kHz
    scan: true

audio_dac:
  - platform: es8311
    id: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 16000

## AudioCTR_PWR, when R23 is assembled, otherwise ALDO2@apx2101 is used.
power_supply:
  - id: amp_power
    pin: GPIO39
    enable_time: 210ms      # Einschwingzeit des NS4150B nach Enable, ggf. anpassen
    keep_on_time: 80ms    # wie lange nach dem letzten Ton noch an bleibt
    
## ------- I2S BUS SETTINGS -------
i2s_audio:
  - id: i2s_out     
    i2s_bclk_pin:
      number: GPIO14
   #   ignore_strapping_warning: true
    i2s_lrclk_pin:
      number: GPIO47
      #ignore_strapping_warning: true
    i2s_mclk_pin: GPIO13
  #- id: i2s_in  ## PDM microphone: clock=GPIO5
    #i2s_lrclk_pin: GPIO5

## -------- AUDIO -------------
speaker:
  # Raw I2S output to the DAC
  - platform: i2s_audio
    id: i2s_speaker_raw
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO21
    dac_type: external
    channel: stereo
  # Mixer: combines the music channel and the announcement (TTS) channel on one speaker
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_speaker_raw
    source_speakers:
      - id: announcement_mixing_input
      - id: media_mixing_input
  # Resamplers (match source sample rates to the mixer)
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input

media_player:
  - platform: speaker
    name: "Player"
    id: media_player_speaker
    announcement_pipeline:
      speaker: announcement_resampling_speaker
    media_pipeline:
      speaker: media_resampling_speaker
    files:
      - id: test_sound
        file: audio/test_tone.wav

