    restore_value: no
  - id: item_descriptions
    type: 'std::vector<std::string>'
    restore_value: no
  - id: pending_uid
    type: std::string
    restore_value: no
  ## --- Confirmation ---
  - id: confirmation_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: confirmation_text
    type: std::string
    restore_value: no
    
