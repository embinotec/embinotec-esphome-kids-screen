## =====================================================================
## Alles Konfigurierbare an einer Stelle:
## - todo_entity      -> die Home-Assistant todo.*-Liste, die angezeigt wird
##                        (wird für den Template-Sensor in Home Assistant
##                        gebraucht, siehe Kommentarblock ganz unten)
## - ha_sensor_entity -> der HA-Sensor, dessen Attribut "list" die
##                        aufbereitete Liste (durch \n getrennt) enthält
## - display_title    -> Überschrift auf dem Display
## Schematics: https://files.waveshare.com/wiki/ESP32-S3-ePaper-3.97/ESP32-S3_e-Paper-3.97-schematic.pdf 
## GPIO  1: 
## GPIO  2:
## =====================================================================
##                           ESP32-S3
##                  +-------------------+
##             GND  | 1               41| GND (Thermal Pad)
##             3V3  | 2                 |
##              EN  | 3               40| GND
##   JOG-UP    IO4  | 4               39| IO1
##   JOG-PUSH  IO5  | 5               38| IO2
##   JOG-DOWN  IO6  | 6               37| IO43/TXD   STATUS_LED
##   SD_DATA1  IO7  | 7               36| IO44/RXD
##   SD_DATA0 IO15  | 8               35| IO42  I2C_SCL
##   SD_CLK   IO16  | 9               34| IO41  I2C_SDA
##   SD_CMD   IO17  | 10              33| IO40
##   SD_DATA3 IO18  | 11              32| IO39  AMP_PWR
##   SD_DATA2  IO8  | 12              31| IO38
##    (USB D-) IO19 | 13              30| IO37  (SPI-FLASH)
##    (USB D+) IO20 | 14              29| IO36  (SPI-FLASH)
## DISPL_BUSY IO3   | 15              28| IO35  (SPI-FLASH)
##            IO46  | 16              27| IO0
## DISPL_DC   IO9   | 17              26| IO45
## DISPL_CS   IO10  | 18              25| IO48
##    SPI_CLK IO11  | 19              24| IO47  I2S_CLK
##   SPI_DATA IO12  | 20              23| IO21  I2S_DOUT
##  I2S_BCLK IO13   | 21              22| IO14  I2S_MCLK
##                  +-------------------+              

## ------ SUBSTITUTIONS -------
substitutions:
  display_title: "Amelia"

## ------ ESPHome HEADER -------
esphome:
  name: kids-screen
  friendly_name: Kids-screen
  comment: "3.97 E-ink display zum Anzeigen des Kalenders."
  min_version: 2026.8.0
  name_add_mac_suffix: false
  
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            const gpio_num_t jog_pins[3] = {GPIO_NUM_4, GPIO_NUM_5, GPIO_NUM_6};
            for (auto p : jog_pins) {
              gpio_reset_pin(p);
              gpio_set_direction(p, GPIO_MODE_INPUT);
              gpio_set_pull_mode(p, GPIO_PULLUP_ONLY);
            }
    - priority: -10
      then:
        - output.turn_on: epd_vcc
        - output.turn_on: audio_ctr_vcc
        - output.turn_on: audio_vcc
        - delay: 200ms
    #    - lambda: |-
    #        if (id(display_sd).is_failed()) {
    #          ESP_LOGW("main", "Keine SD-Karte erkannt oder Mount fehlgeschlagen");
    #        }

## ------ ESP32 configuration ------
## Please be aware of changing one of these configuration options could cause in uncompilable code.
esp32:
  board: esp32-s3-devkitc1-n16r8   # ggf. auf dein konkretes Board anpassen
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_FATFS_LFN_STACK: "y"
    advanced:
      include_builtin_idf_components: ["fatfs", "spiffs"]
      disable_vfs_support_termios: false
      disable_vfs_support_select: false
      disable_vfs_support_dir: false

psram:
  mode: octal
  speed: 80MHZ

#external_components:
#  - source: github://stefanthoss/esphome-axp2101
#    components: [ axp2101 ]
external_components:
  - source: github://m5stack/esphome-yaml/components
    components: [axp2101 ]
  ## -- SD Card Component --
  - source: 
      type: git
      url: https://github.com/n-serrette/esphome_sd_card
      ref: main
    components: [sd_mmc_card]#[sd_file_server, sd_mmc_card]

## ------ GLOBALS -------
globals:
