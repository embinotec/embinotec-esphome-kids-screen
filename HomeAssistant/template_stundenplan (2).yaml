- sensor:
    - name: "Eink Stundenplan"
      unique_id: eink_stundenplan
      state: "{{ now().isoformat() }}"
      attributes:
        tabelle: >-
          {%- set plan = state_attr('sensor.stundenplan', 'plan') or [] -%}
          {%- for r in plan if not r.get('break') -%}
          {{ r.Stunde.split(' ')[0] }}|{{ r.Mo }}|{{ r.Di }}|{{ r.Mi }}|{{ r.Do }}|{{ r.Fr }}{{ '\n' if not loop.last }}
          {%- endfor -%}